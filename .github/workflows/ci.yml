name: CI

on:
  push:
    branches: [ main, feature, bug/fix ]
  pull_request:
    branches: [ main, feature, bug/fix ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
